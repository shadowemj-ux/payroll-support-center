</head>
<body data-page="center">

<header>
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <div class="logo">센터</div>
      <div><b>급여통합지원센터</b><span>Integrated Payroll Support Center</span></div>

    <nav>
      <a data-page="notice" href="notice.html">공지사항</a>

      <a class="admin-link" href="admin/login.html">관리자</a>
    </nav>

<main>
<section class="page">
<div class="wrap">
  <div class="page-title"><h1>센터안내</h1><p>직원 개인정보 없이 업무내용과 대표 전화번호만 안내합니다.</p></div>
  <section class="panel">
    <div class="panel-head"><div><h2>업무별 문의 안내</h2><p>문의하실 업무에 해당하는 전화번호를 확인해 주세요.</p></div></div>
    <div class="panel-body"><div id="contacts" class="contact-list"><div class="loading">불러오는 중...</div></div></div>
  </section>
</div>
</section>
<script>
document.addEventListener("DOMContentLoaded", async ()=>{
 const wrap=document.getElementById("contacts");
 const {data,error}=await db.from("center_contacts").select("*").eq("is_active",true).order("sort_order");
 if(error) return wrap.innerHTML='<div class="empty">센터안내를 불러오지 못했습니다.</div>';
 if(!data.length) return wrap.innerHTML='<div class="empty">등록된 문의 안내가 없습니다.</div>';
 wrap.innerHTML=data.map(x=>`<div class="contact-card"><b>${esc(x.work_name)}</b><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div>`).join("");
});
</script>
</main>

<footer>
  <div class="wrap">
    <b>급여통합지원센터</b>
    <p>교육공무직원 급여업무 지원을 위한 업무지원 홈페이지</p>
  </div>
</footer>
</body>
</html>
