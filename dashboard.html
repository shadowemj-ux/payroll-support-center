<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 | 급여통합지원센터</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script defer src="../assets/js/common.js"></script>
</head><body>
<div class="admin-shell">
  <div class="admin-top">
    <div><h1>급여통합지원센터 관리자</h1><div class="help">공지, 프로그램, 질의응답, 건의사항, 센터안내를 관리합니다.</div></div>
    <div><a class="btn btn-secondary btn-small" href="../index.html">홈페이지</a> <button id="logoutBtn" class="btn btn-secondary btn-small">로그아웃</button></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="notices">공지사항</button>
    <button class="tab-btn" data-tab="programs">프로그램</button>
    <button class="tab-btn" data-tab="qna">질의응답</button>
    <button class="tab-btn" data-tab="suggestions">건의사항</button>
    <button class="tab-btn" data-tab="contacts">센터안내</button>
  </div>

  <section id="tab-notices" class="tab-pane active">
    <div class="admin-grid">
      <div class="panel"><div class="panel-head"><h2>공지 목록</h2></div><div id="adminNoticeList" class="admin-list loading">불러오는 중...</div></div>
      <div class="panel"><div class="panel-head"><h2>공지 작성 / 수정</h2></div><div class="panel-body">
        <form id="noticeForm" class="form-grid">
          <input type="hidden" id="noticeId">
          <div class="field full"><label>제목</label><input id="noticeTitle" required></div>
          <div class="field full"><label>내용</label><textarea id="noticeContent" required></textarea></div>
          <div class="field"><label><input id="noticePinned" type="checkbox" style="width:auto"> 중요공지</label></div>
          <div class="field"><label><input id="noticePublished" type="checkbox" style="width:auto" checked> 공개</label></div>
          <div class="field full"><button class="btn btn-primary" type="submit">저장</button> <button id="noticeReset" class="btn btn-secondary" type="button">새 글</button><div id="noticeMsg"></div></div>
        </form>
      </div></div>
    </div>
  </section>

  <section id="tab-programs" class="tab-pane">
    <div class="panel"><div class="panel-head"><h2>업무지원 프로그램</h2></div><div class="panel-body"><div id="adminPrograms" class="card-list loading">불러오는 중...</div></div></div>
  </section>

  <section id="tab-qna" class="tab-pane">
    <div class="panel"><div class="panel-head"><h2>질의응답 관리</h2></div><div class="panel-body"><div id="adminQna" class="card-list loading">불러오는 중...</div></div></div>
  </section>

  <section id="tab-suggestions" class="tab-pane">
    <div class="panel"><div class="panel-head"><h2>건의사항 관리</h2></div><div class="panel-body"><div id="adminSuggestions" class="card-list loading">불러오는 중...</div></div></div>
  </section>

  <section id="tab-contacts" class="tab-pane">
    <div class="admin-grid">
      <div class="panel"><div class="panel-head"><h2>센터안내 목록</h2></div><div id="adminContacts" class="admin-list loading">불러오는 중...</div></div>
      <div class="panel"><div class="panel-head"><h2>업무 / 전화번호 등록</h2></div><div class="panel-body">
        <form id="contactForm" class="form-grid">
          <input type="hidden" id="contactId">
          <div class="field full"><label>업무내용</label><input id="contactWork" required></div>
          <div class="field"><label>전화번호</label><input id="contactPhone" required></div>
          <div class="field"><label>정렬순서</label><input id="contactSort" type="number" value="0"></div>
          <div class="field full"><button class="btn btn-primary" type="submit">저장</button> <button id="contactReset" class="btn btn-secondary" type="button">새 항목</button><div id="contactMsg"></div></div>
        </form>
      </div></div>
    </div>
  </section>
</div>

<script>
let adminReady=false;
function switchTab(name){
 document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
 document.querySelectorAll(".tab-pane").forEach(p=>p.classList.toggle("active",p.id==="tab-"+name));
}
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

async function loadNotices(){
 const wrap=document.getElementById("adminNoticeList");
 const {data,error}=await db.from("notices").select("*").order("created_at",{ascending:false});
 if(error) return wrap.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 if(!data.length) return wrap.innerHTML='<div class="empty">등록된 공지가 없습니다.</div>';
 wrap.classList.remove("loading");
 wrap.innerHTML=data.map(n=>`<div class="admin-item">
   <h4>${n.is_pinned?"[중요] ":""}${esc(n.title)}</h4>
   <p>${fmtDateTime(n.created_at)} · ${n.is_published?"공개":"비공개"}</p>
   <div class="admin-actions">
     <button class="btn btn-secondary btn-small" onclick='editNotice(${JSON.stringify(n)})'>수정</button>
     <button class="btn btn-danger btn-small" onclick="deleteNotice(${n.id})">삭제</button>
   </div>
 </div>`).join("");
}
window.editNotice=n=>{
 document.getElementById("noticeId").value=n.id;
 document.getElementById("noticeTitle").value=n.title;
 document.getElementById("noticeContent").value=n.content;
 document.getElementById("noticePinned").checked=n.is_pinned;
 document.getElementById("noticePublished").checked=n.is_published;
};
window.deleteNotice=async id=>{
 if(!confirm("이 공지를 삭제하시겠습니까?")) return;
 const {error}=await db.from("notices").delete().eq("id",id);
 if(error) alert(error.message); else loadNotices();
};
function resetNotice(){
 document.getElementById("noticeForm").reset();
 document.getElementById("noticeId").value="";
 document.getElementById("noticePublished").checked=true;
}
document.getElementById("noticeReset").onclick=resetNotice;
document.getElementById("noticeForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const id=document.getElementById("noticeId").value;
 const payload={
   title:document.getElementById("noticeTitle").value.trim(),
   content:document.getElementById("noticeContent").value.trim(),
   is_pinned:document.getElementById("noticePinned").checked,
   is_published:document.getElementById("noticePublished").checked
 };
 const op=id ? db.from("notices").update(payload).eq("id",id) : db.from("notices").insert(payload);
 const {error}=await op;
 const msg=document.getElementById("noticeMsg");
 if(error) msg.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 else{msg.innerHTML='<div class="success-box">저장되었습니다.</div>';resetNotice();loadNotices();}
});

async function loadPrograms(){
 const wrap=document.getElementById("adminPrograms");
 const {data,error}=await db.from("programs").select("*").order("sort_order");
 if(error) return wrap.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 wrap.classList.remove("loading");
 wrap.innerHTML=data.map(p=>`<div class="item-card">
   <h3>${esc(p.name)}</h3>
   <form class="form-grid" onsubmit="saveProgram(event,'${p.code}')">
     <div class="field"><label>버전</label><input id="ver-${p.code}" value="${esc(p.version||"")}"></div>
     <div class="field"><label>배포일</label><input id="date-${p.code}" type="date" value="${esc(p.release_date||"")}"></div>
     <div class="field full"><label>변경사항</label><textarea id="notes-${p.code}" style="min-height:100px">${esc(p.change_notes||"")}</textarea></div>
     <div class="field full"><label>엑셀 파일</label><input id="file-${p.code}" type="file" accept=".xls,.xlsx,.xlsm,.xlsb"><div class="help">새 파일을 선택하지 않으면 기존 파일이 유지됩니다.</div></div>
     <div class="field full"><button class="btn btn-primary" type="submit">저장</button><span id="msg-${p.code}"></span></div>
   </form>
 </div>`).join("");
}
window.saveProgram=async(e,code)=>{
 e.preventDefault();
 const msg=document.getElementById("msg-"+code); msg.innerHTML="";
 const file=document.getElementById("file-"+code).files[0];
 let filePath=null;
 if(file){
   // Supabase Storage 객체 경로는 한글 파일명을 그대로 넣지 않고
   // 영문/숫자로만 된 내부 저장명으로 생성합니다.
   const rawExt=(file.name.split(".").pop()||"").toLowerCase();
   const safeExt=rawExt.replace(/[^a-z0-9]/g,"") || "xlsm";
   filePath=`${code}/${Date.now()}.${safeExt}`;
   const {error:ue}=await db.storage.from("program-files").upload(filePath,file,{upsert:false});
   if(ue){msg.innerHTML=`<span class="error-box">${esc(ue.message)}</span>`;return;}
 }
 const payload={
   version:document.getElementById("ver-"+code).value.trim()||null,
   release_date:document.getElementById("date-"+code).value||null,
   change_notes:document.getElementById("notes-"+code).value.trim()||null
 };
 if(filePath) payload.file_path=filePath;
 const {error}=await db.from("programs").update(payload).eq("code",code);
 if(error) msg.innerHTML=`<span class="error-box">${esc(error.message)}</span>`;
 else{msg.innerHTML='<span class="success-box">저장되었습니다.</span>';loadPrograms();}
};

async function loadQna(){
 const wrap=document.getElementById("adminQna");
 const [{data:qnas,error:qe},{data:priv,error:pe}]=await Promise.all([
   db.from("qna").select("*").order("created_at",{ascending:false}),
   db.from("qna_private_info").select("qna_id,institution")
 ]);
 if(qe||pe) return wrap.innerHTML=`<div class="error-box">${esc(qe?.message||pe?.message)}</div>`;
 const map=Object.fromEntries((priv||[]).map(x=>[x.qna_id,x.institution]));
 if(!qnas.length) return wrap.innerHTML='<div class="empty">등록된 질의가 없습니다.</div>';
 wrap.classList.remove("loading");
 wrap.innerHTML=qnas.map(x=>`<article class="item-card">
   <h3>${esc(x.title)}</h3>
   <div class="item-meta"><span>${esc(x.inquiry_no||"-")}</span><span>${esc(map[x.id]||"-")}</span><span>${x.visibility==="public"?"공개":"비공개"}</span><span>${fmtDateTime(x.created_at)}</span></div>
   <p style="margin-top:10px;white-space:pre-wrap">${esc(x.question)}</p>
   <div class="field" style="margin-top:12px"><label>답변</label><textarea id="ans-${x.id}" style="min-height:110px">${esc(x.answer||"")}</textarea></div>
   <div class="admin-actions"><button class="btn btn-primary btn-small" onclick="saveAnswer('${x.id}')">답변 저장</button>
   <span id="ansmsg-${x.id}"></span></div>
 </article>`).join("");
}
window.saveAnswer=async id=>{
 const answer=document.getElementById("ans-"+id).value.trim();
 const payload={answer:answer||null,status:answer?"answered":"waiting",answered_at:answer?new Date().toISOString():null};
 const {error}=await db.from("qna").update(payload).eq("id",id);
 const m=document.getElementById("ansmsg-"+id);
 m.innerHTML=error?`<span class="error-box">${esc(error.message)}</span>`:'<span class="success-box">저장됨</span>';
 if(!error) setTimeout(loadQna,500);
};

async function loadSuggestions(){
 const wrap=document.getElementById("adminSuggestions");
 const {data,error}=await db.from("suggestions").select("*").order("created_at",{ascending:false});
 if(error) return wrap.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 if(!data.length) return wrap.innerHTML='<div class="empty">등록된 건의사항이 없습니다.</div>';
 wrap.classList.remove("loading");
 wrap.innerHTML=data.map(x=>`<article class="item-card">
   <h3>${esc(x.title)}</h3>
   <div class="item-meta"><span>${esc(x.institution)}</span><span>${fmtDateTime(x.created_at)}</span></div>
   <p style="margin-top:10px;white-space:pre-wrap">${esc(x.content)}</p>
   <div class="field" style="margin-top:12px"><label>처리상태</label>
     <select id="st-${x.id}">
       <option value="received" ${x.status==="received"?"selected":""}>접수</option>
       <option value="reviewing" ${x.status==="reviewing"?"selected":""}>검토중</option>
       <option value="accepted" ${x.status==="accepted"?"selected":""}>반영</option>
       <option value="not_accepted" ${x.status==="not_accepted"?"selected":""}>미반영</option>
     </select>
   </div>
   <div class="admin-actions"><button class="btn btn-primary btn-small" onclick="saveSuggestion('${x.id}')">상태 저장</button><span id="sgmsg-${x.id}"></span></div>
 </article>`).join("");
}
window.saveSuggestion=async id=>{
 const status=document.getElementById("st-"+id).value;
 const {error}=await db.from("suggestions").update({status}).eq("id",id);
 document.getElementById("sgmsg-"+id).innerHTML=error?`<span class="error-box">${esc(error.message)}</span>`:'<span class="success-box">저장됨</span>';
};

async function loadContacts(){
 const wrap=document.getElementById("adminContacts");
 const {data,error}=await db.from("center_contacts").select("*").order("sort_order");
 if(error) return wrap.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 if(!data.length) return wrap.innerHTML='<div class="empty">등록된 센터안내가 없습니다.</div>';
 wrap.classList.remove("loading");
 wrap.innerHTML=data.map(x=>`<div class="admin-item">
  <h4>${esc(x.work_name)}</h4><p>${esc(x.phone)} · 순서 ${x.sort_order}</p>
  <div class="admin-actions">
    <button class="btn btn-secondary btn-small" onclick='editContact(${JSON.stringify(x)})'>수정</button>
    <button class="btn btn-danger btn-small" onclick="deleteContact(${x.id})">삭제</button>
  </div>
 </div>`).join("");
}
window.editContact=x=>{
 document.getElementById("contactId").value=x.id;
 document.getElementById("contactWork").value=x.work_name;
 document.getElementById("contactPhone").value=x.phone;
 document.getElementById("contactSort").value=x.sort_order;
};
window.deleteContact=async id=>{
 if(!confirm("삭제하시겠습니까?")) return;
 const {error}=await db.from("center_contacts").delete().eq("id",id);
 if(error) alert(error.message); else loadContacts();
};
function resetContact(){
 document.getElementById("contactForm").reset();document.getElementById("contactId").value="";document.getElementById("contactSort").value=0;
}
document.getElementById("contactReset").onclick=resetContact;
document.getElementById("contactForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const id=document.getElementById("contactId").value;
 const payload={
  work_name:document.getElementById("contactWork").value.trim(),
  phone:document.getElementById("contactPhone").value.trim(),
  sort_order:Number(document.getElementById("contactSort").value||0)
 };
 const op=id?db.from("center_contacts").update(payload).eq("id",id):db.from("center_contacts").insert(payload);
 const {error}=await op;
 const msg=document.getElementById("contactMsg");
 if(error) msg.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
 else{msg.innerHTML='<div class="success-box">저장되었습니다.</div>';resetContact();loadContacts();}
});

document.addEventListener("DOMContentLoaded",async ()=>{
 if(!(await requireAdmin())) return;
 adminReady=true;
 loadNotices();loadPrograms();loadQna();loadSuggestions();loadContacts();
 document.getElementById("logoutBtn").onclick=async()=>{await db.auth.signOut();location.href="login.html";};
});
</script>
</body></html>
