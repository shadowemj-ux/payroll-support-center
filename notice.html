<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공지사항 | 급여통합지원센터</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script defer src="assets/js/common.js"></script>

</head>
<body data-page="notice">

<header>
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <div class="logo">센터</div>
      <div><b>급여통합지원센터</b><span>Integrated Payroll Support Center</span></div>
    </a>
    <nav>
      <a data-page="notice" href="notice.html">공지사항</a>
      <a data-page="programs" href="programs.html">업무지원 프로그램 최신버전</a>
      <a data-page="qna" href="qna.html">질의응답</a>
      <a data-page="suggestion" href="suggestion.html">건의사항</a>
      <a data-page="center" href="center.html">센터안내</a>
      <a class="admin-link" href="admin/login.html">관리자</a>
    </nav>
  </div>
</header>
<main>
<section class="page">
<div class="wrap">
  <div class="page-title"><h1>공지사항</h1><p>급여통합지원센터의 주요 안내사항을 확인할 수 있습니다.</p></div>
  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:80px">구분</th><th>제목</th><th style="width:120px">등록일</th></tr></thead>
        <tbody id="noticeRows"><tr><td colspan="3" class="loading">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </section>
</div>
</section>
<script>
document.addEventListener("DOMContentLoaded", async ()=>{
  const tbody = document.getElementById("noticeRows");
  const { data, error } = await db.from("notices")
    .select("id,title,is_pinned,created_at").eq("is_published",true)
    .order("is_pinned",{ascending:false}).order("created_at",{ascending:false});
  if(error) return tbody.innerHTML='<tr><td colspan="3" class="empty">공지사항을 불러오지 못했습니다.</td></tr>';
  if(!data.length) return tbody.innerHTML='<tr><td colspan="3" class="empty">등록된 공지사항이 없습니다.</td></tr>';
  tbody.innerHTML=data.map(n=>`<tr>
    <td><span class="badge">${n.is_pinned?"중요":"공지"}</span></td>
    <td><a class="title-link" href="notice-view.html?id=${n.id}">${esc(n.title)}</a></td>
    <td>${fmtDate(n.created_at)}</td>
  </tr>`).join("");
});
</script>
</main>

<footer>
  <div class="wrap">
    <b>급여통합지원센터</b>
    <p>교육공무직원 급여업무 지원을 위한 업무지원 홈페이지</p>
  </div>
</footer>
</body>
</html>
