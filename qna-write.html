<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>질문 등록 | 통합급여 지원센터</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script defer src="assets/js/common.js"></script>

</head>
<body data-page="qna">

<header>
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <div class="logo">센터</div>
      <div><b>통합급여 지원센터</b><span>Integrated Payroll Support Center</span></div>
    </a>
    <nav>
      <a data-page="notice" href="notice.html">공지사항</a>
      <a data-page="programs" href="programs.html">업무지원 프로그램 최신버전</a>
      <a data-page="qna" href="qna.html">질의응답</a>
      <a data-page="suggestion" href="suggestion.html">건의사항</a>
      <a data-page="center" href="center.html">센터안내</a>
      <a class="admin-link" href="admin/login.html">관리자</a>
    </nav>
  </div>
</header>
<main>
<section class="page">
<div class="wrap">
  <div class="page-title"><h1>질문 등록</h1><p>작성자 이름은 받지 않습니다. 기관명은 관리자에게만 표시됩니다.</p></div>
  <section class="panel">
    <div class="panel-body">
      <div class="warn">※ 성명, 주민등록번호, 계좌번호 등 개인정보는 질의내용에 입력하지 마십시오.</div>
      <div style="height:16px"></div>
      <form id="qnaForm" class="form-grid">
        <div class="field">
          <label for="institution">기관명</label>
          <input id="institution" required placeholder="예: ○○초등학교">
          <div class="help">기관명은 관리자에게만 표시됩니다.</div>
        </div>
        <div class="field">
          <label>공개 여부</label>
          <div class="radio-row">
            <label class="radio-card"><input type="radio" name="visibility" value="public" checked><span><b>공개</b><br><span class="help">질문과 답변을 다른 이용자도 볼 수 있습니다.</span></span></label>
            <label class="radio-card"><input type="radio" name="visibility" value="private"><span><b>비공개</b><br><span class="help">확인코드로만 질문과 답변을 확인합니다.</span></span></label>
          </div>
        </div>
        <div class="field full">
          <label for="title">제목</label>
          <input id="title" required maxlength="150">
        </div>
        <div class="field full">
          <label for="question">질의내용</label>
          <textarea id="question" required></textarea>
        </div>
        <div class="field full">
          <button id="submitBtn" class="btn btn-primary" type="submit">질문 등록</button>
          <div id="formMsg"></div>
        </div>
      </form>
    </div>
  </section>
</div>
</section>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 document.getElementById("qnaForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("submitBtn"), msg=document.getElementById("formMsg");
  btn.disabled=true; msg.innerHTML="";
  const visibility=document.querySelector('input[name="visibility"]:checked').value;
  const params={
    p_institution:document.getElementById("institution").value.trim(),
    p_title:document.getElementById("title").value.trim(),
    p_question:document.getElementById("question").value.trim(),
    p_visibility:visibility
  };
  const {data,error}=await db.rpc("submit_qna",params);
  btn.disabled=false;
  if(error){ msg.innerHTML=`<div class="error-box">${esc(error.message)}</div>`; return; }
  const result=data?.[0];
  if(!result){ msg.innerHTML='<div class="error-box">등록 결과를 확인하지 못했습니다.</div>'; return; }
  msg.innerHTML=`<div class="success-box">
    질문이 등록되었습니다.<br>
    <b>확인코드: ${esc(result.access_code)}</b><br><br>
    ${visibility==="private" ? "비공개 질문을 다시 확인하려면 이 확인코드가 반드시 필요합니다." :
      "공개 질문도 확인코드를 보관해 두시면 좋습니다."}<br>
    <b>이 코드는 다시 표시되지 않으므로 지금 별도로 보관해 주세요.</b>
  </div>`;
  e.target.reset();
 });
});
</script>
</main>

<footer>
  <div class="wrap">
    <b>통합급여 지원센터</b>
    <p>교육공무직원 급여업무 지원을 위한 업무지원 홈페이지</p>
  </div>
</footer>
</body>
</html>
