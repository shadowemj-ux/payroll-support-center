<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>질문 등록 | 급여통합지원센터</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script defer src="assets/js/common.js"></script>

</head>
<body data-page="qna">

<header>
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <div class="logo">센터</div>
      <div><b>급여통합지원센터</b><span>Integrated Payroll Support Center</span></div>
    </a>
    <nav>
      <a data-page="notice" href="notice.html">공지사항</a>
      <a data-page="programs" href="programs.html">업무지원 프로그램 최신버전</a>
      <a data-page="qna" href="qna.html">질의응답</a>
      <a data-page="suggestion" href="suggestion.html">건의사항</a>
      <a data-page="center" href="center.html">센터안내</a>
      <a class="admin-link" href="admin/login.html">관리자</a>
    </nav>
  </div>
</header>
<main>
<section class="page">
<div class="wrap">
  <div class="page-title"><h1>질문 등록</h1><p>작성자 이름은 받지 않습니다. 기관명은 관리자에게만 표시됩니다.</p></div>
  <section class="panel">
    <div class="panel-body">
      <div class="warn">※ 성명, 주민등록번호, 계좌번호 등 개인정보는 질의내용에 입력하지 마십시오.</div>
      <div style="height:16px"></div>
      <form id="qnaForm" class="form-grid">
        <div class="field">
          <label for="institution">기관명</label>
          <input id="institution" required placeholder="예: ○○초등학교">
          <div class="help">기관명은 관리자에게만 표시됩니다.</div>
        </div>
        <div class="field">
          <label>공개 여부</label>
          <div class="radio-row">
            <label class="radio-card"><input type="radio" name="visibility" value="public" checked><span><b>공개</b><br><span class="help">질문과 답변을 다른 이용자도 볼 수 있습니다.</span></span></label>
            <label class="radio-card"><input type="radio" name="visibility" value="private"><span><b>비공개</b><br><span class="help">문의번호와 4자리 비밀번호로 질문과 답변을 확인합니다. (예: Q-260911-001)</span></span></label>
          </div>
        </div>
        <div class="field full" id="privatePasswordField" style="display:none">
          <label for="privatePassword">비공개 조회 비밀번호</label>
          <input id="privatePassword" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="new-password" placeholder="숫자 4자리">
          <div class="help">비공개 질문을 다시 확인할 때 문의번호와 함께 사용합니다. 비밀번호는 관리자도 확인할 수 없습니다.</div>
        </div>
        <div class="field full">
          <label for="title">제목</label>
          <input id="title" required maxlength="150">
        </div>
        <div class="field full">
          <label for="question">질의내용</label>
          <textarea id="question" required></textarea>
        </div>
        <div class="field full">
          <button id="submitBtn" class="btn btn-primary" type="submit">질문 등록</button>
          <div id="formMsg"></div>
        </div>
      </form>
    </div>
  </section>
</div>
</section>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const form=document.getElementById("qnaForm");
 const passwordField=document.getElementById("privatePasswordField");
 const passwordInput=document.getElementById("privatePassword");
 const radios=[...document.querySelectorAll('input[name="visibility"]')];

 function syncPrivatePassword(){
   const visibility=document.querySelector('input[name="visibility"]:checked').value;
   const isPrivate=visibility==="private";
   passwordField.style.display=isPrivate?"block":"none";
   passwordInput.required=isPrivate;
   if(!isPrivate) passwordInput.value="";
 }

 radios.forEach(r=>r.addEventListener("change",syncPrivatePassword));
 passwordInput.addEventListener("input",()=>{
   passwordInput.value=passwordInput.value.replace(/\D/g,"").slice(0,4);
 });
 syncPrivatePassword();

 form.addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("submitBtn"), msg=document.getElementById("formMsg");
  const visibility=document.querySelector('input[name="visibility"]:checked').value;
  const password=passwordInput.value.trim();

  if(visibility==="private" && !/^\d{4}$/.test(password)){
    msg.innerHTML='<div class="error-box">비공개 조회 비밀번호를 숫자 4자리로 입력해 주세요.</div>';
    passwordInput.focus();
    return;
  }

  btn.disabled=true; msg.innerHTML="";
  const params={
    p_institution:document.getElementById("institution").value.trim(),
    p_title:document.getElementById("title").value.trim(),
    p_question:document.getElementById("question").value.trim(),
    p_visibility:visibility,
    p_password:visibility==="private"?password:null
  };

  const {data,error}=await db.rpc("submit_qna_v2",params);
  btn.disabled=false;

  if(error){
    msg.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
    return;
  }

  const result=data?.[0];
  if(!result){
    msg.innerHTML='<div class="error-box">등록 결과를 확인하지 못했습니다.</div>';
    return;
  }

  msg.innerHTML=`<div class="success-box">
    질문이 등록되었습니다.<br>
    <b>문의번호: ${esc(result.inquiry_no)}</b><br><br>
    ${visibility==="private"
      ? "비공개 질문은 위 문의번호와 입력하신 4자리 비밀번호로 다시 확인할 수 있습니다.<br><b>문의번호와 비밀번호를 함께 보관해 주세요.</b>"
      : "공개 질문은 질의응답 목록에서 확인할 수 있습니다."}
  </div>`;

  form.reset();
  syncPrivatePassword();
 });
});
</script>
</main>

<footer>
  <div class="wrap">
    <b>급여통합지원센터</b>
    <p>교육공무직원 급여업무 지원을 위한 업무지원 홈페이지</p>
  </div>
</footer>
</body>
</html>
