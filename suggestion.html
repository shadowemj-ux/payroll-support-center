<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건의사항 | 통합급여 지원센터</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script defer src="assets/js/common.js"></script>

</head>
<body data-page="suggestion">

<header>
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <div class="logo">센터</div>
      <div><b>통합급여 지원센터</b><span>Integrated Payroll Support Center</span></div>
    </a>
    <nav>
      <a data-page="notice" href="notice.html">공지사항</a>
      <a data-page="programs" href="programs.html">업무지원 프로그램 최신버전</a>
      <a data-page="qna" href="qna.html">질의응답</a>
      <a data-page="suggestion" href="suggestion.html">건의사항</a>
      <a data-page="center" href="center.html">센터안내</a>
      <a class="admin-link" href="admin/login.html">관리자</a>
    </nav>
  </div>
</header>
<main>
<section class="page">
<div class="wrap">
  <div class="page-title"><h1>건의사항</h1><p>통합급여 운영 및 업무지원 프로그램 개선에 관한 의견을 접수합니다.</p></div>
  <section class="panel">
    <div class="panel-body">
      <div class="warn">※ 성명, 주민등록번호, 계좌번호 등 개인정보는 건의내용에 입력하지 마십시오.</div>
      <div style="height:16px"></div>
      <form id="suggestForm" class="form-grid">
        <div class="field full"><label for="institution">기관명</label><input id="institution" required><div class="help">기관명은 관리자에게만 표시됩니다.</div></div>
        <div class="field full"><label for="title">제목</label><input id="title" required maxlength="150"></div>
        <div class="field full"><label for="content">건의내용</label><textarea id="content" required></textarea></div>
        <div class="field full"><button id="submitBtn" class="btn btn-primary" type="submit">건의사항 등록</button><div id="msg"></div></div>
      </form>
    </div>
  </section>
</div>
</section>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 document.getElementById("suggestForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("submitBtn"), msg=document.getElementById("msg");
  btn.disabled=true; msg.innerHTML="";
  const {data,error}=await db.rpc("submit_suggestion",{
    p_institution:document.getElementById("institution").value.trim(),
    p_title:document.getElementById("title").value.trim(),
    p_content:document.getElementById("content").value.trim()
  });
  btn.disabled=false;
  if(error) return msg.innerHTML=`<div class="error-box">${esc(error.message)}</div>`;
  msg.innerHTML='<div class="success-box">건의사항이 정상적으로 접수되었습니다.</div>';
  e.target.reset();
 });
});
</script>
</main>

<footer>
  <div class="wrap">
    <b>통합급여 지원센터</b>
    <p>교육공무직원 급여업무 지원을 위한 업무지원 홈페이지</p>
  </div>
</footer>
</body>
</html>
